# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION — DOM ROCKFELLER & ROCKFELLER CARROS
# Domínio: domrockfeller.com.br / www.domrockfeller.com.br
# Caminho de instalação recomendado no VPS: /etc/nginx/sites-available/domrockfeller.conf
# ==============================================================================

# 1. Redirecionamento HTTP para HTTPS (Ativado automaticamente após gerar certificado Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name domrockfeller.com.br www.domrockfeller.com.br;

    # Validação do Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todo o tráfego HTTP para HTTPS seguro
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Principal HTTPS Seguro
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domrockfeller.com.br www.domrockfeller.com.br;

    # Certificados SSL (Emitidos gratuitamente pelo Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/domrockfeller.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domrockfeller.com.br/privkey.pem;

    # Protocolos e Cifras Criptográficas Fortes (A+ SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeçalhos HTTP de Segurança Avançada
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão Gzip para Carregamento Ultrarrápido
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff font/woff2 image/svg+xml;

    # Limite de Upload (para envio de fotos de estoque e anexos contratuais)
    client_max_body_size 25M;

    # Cache de Ativos Estáticos (Imagens de Carros, CSS, JS)
    location /carros-estoque/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy Reverso para a Aplicação Node.js (Porta 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Suporte completo a WebSockets e Server-Sent Events (Live Chat e Notificações)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Cabeçalhos de Identificação Real do Cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de Conexão
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
