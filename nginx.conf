# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION — DOM ROCKFELLER & ROCKFELLER CARROS
# Domínio: domrockfeller.com.br / www.domrockfeller.com.br
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name domrockfeller.com.br www.domrockfeller.com.br;

    # Limite de Upload (fotos de carros e documentos)
    client_max_body_size 25M;

    # Compressão Gzip para Carregamento Ultrarrápido
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff font/woff2 image/svg+xml;

    # Cabeçalhos HTTP de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache de Ativos Estáticos (Imagens de Carros, CSS, JS)
    location /carros-estoque/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy Reverso para a Aplicação Node.js (Porta 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Suporte completo a WebSockets e Server-Sent Events (Live Chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Cabeçalhos de Identificação Real do Cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de Conexão
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
