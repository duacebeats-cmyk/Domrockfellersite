<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
  </defs>

  <!-- Background rounded shield -->
  <path d="M60 6 L104 22 C104 70, 60 110, 60 114 C60 110, 16 70, 16 22 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="3.5" />

  <!-- Inner crest border -->
  <path d="M60 14 L96 28 C96 66, 60 98, 60 102 C60 98, 24 66, 24 28 Z" 
        fill="none" 
        stroke="rgba(245, 158, 11, 0.4)" 
        stroke-width="1.5" />

  <!-- Crown top -->
  <path d="M48 30 L53 38 L60 28 L67 38 L72 30 L70 42 L50 42 Z" 
        fill="url(#goldGrad)" />
  <circle cx="48" cy="28" r="2" fill="#FDE68A" />
  <circle cx="60" cy="26" r="2.5" fill="#FDE68A" />
  <circle cx="72" cy="28" r="2" fill="#FDE68A" />

  <!-- Stylized Monogram D R -->
  <!-- Letter D -->
  <path d="M42 48 L56 48 C64 48, 68 53, 68 62 C68 71, 63 76, 56 76 L42 76 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Letter R overlaid -->
  <path d="M58 54 L69 54 C75 54, 78 57, 78 62 C78 66, 75 69, 70 70 L80 84" 
        fill="none" 
        stroke="#34D399" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Little Emerald star center-bottom -->
  <polygon points="60,86 62,91 67,91 63,94 65,99 60,96 55,99 57,94 53,91 58,91" fill="#34D399" />
</svg>